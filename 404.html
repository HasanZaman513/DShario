<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DShario</title></head><body><script>
(function(){
  var m=decodeURIComponent(location.pathname).match(/\/@([a-z0-9-]+)\/?$/i);
  if(m){
    var slug=m[1].toLowerCase();
    try{sessionStorage.setItem('dshario-personal-route',slug);}catch(e){}
    location.replace('/?card='+encodeURIComponent(slug)+'&personal=1&route=personal');
  }else{location.replace('/');}
})();
</script></body></html>
